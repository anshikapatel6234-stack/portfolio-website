<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user input</title>
    <style>
        body{
            background-image: url(https://img.magnific.com/free-photo/3d-wooden-table-looking-out-mountain-landscape_1048-8949.jpg?semt=ais_hybrid&w=740&q=80);
            background-repeat: no-repeat;
            background-size: cover;
        }
        .text1{
            font-family:'Times New Roman', Times, serif;
            
            font-size: 40px;
            color:black;
            text-decoration-line:underline;
             text-decoration-style:wavy;
             text-decoration-thickness:4px ;
            text-decoration-color:brown;
            /* text-align: center; */
        }
        button{
            color: aliceblue;
            background-color:rgb(159, 159, 7);
        }
        
            
        
        p{
            font-style: italic;
            font-size: 50px;
        }
        .text2{
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: black;
            font-size: 40px;
            text-decoration-line:underline;
             text-decoration-style:wavy;
            text-decoration-color:brown ;
        }
        #heading{
            font-family: 'Times New Roman', Times, serif;
            color: chartreuse;
        }
        .text3{
            font-family:monospace;
            color: black;
            font-size: 40px;
            text-decoration-line: underline;
            text-decoration-style:wavy;
            text-decoration-thickness:4px ;
            text-decoration-color: brown;
        }
        #notice{
            color:chartreuse;
            font-family: sans-serif;
        }
        .text4{
            color: black;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 40px;
            text-decoration-line:underline ;
            text-decoration-style:wavy;
            text-decoration-thickness:4px ;
            text-decoration-color:brown ;
       }
       .sub{
        color:chartreuse;
        font-size: 35px;
        font-weight: 900px;
       }
       #subjects{
        font-size: 25px;
        font-weight: bold;
        color: black;

       }
       .text5{
            color: black;
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 40px;
            text-decoration-line:underline ;
            text-decoration-style:wavy;
            text-decoration-thickness:4px ;
            text-decoration-color:brown ;
        }
        #head{
            color:chartreuse;
            
        }
        
        .highlight{
            color:white;
            background-color: green;
        }

        hr{
            border: none;
            height: 1px;
            background-color:white;
        }
    </style>
</head>
<body id="page">
    <h1 class="text1">1.Display User Input on the Webpage</h1>
    <p id="output"></p>
    <button onclick="enterusername()">enter name</button>
    <!-- <p id="output"></p> -->
    <hr>


    <h1 class="text2">2.change text and style on button click</h1>
     <h1 id="heading">welcome to the world of coding</h1> 

    <button onclick="changeText()">Click here</button>
    <hr>


    <h1 class="text3">3.Remove an Element and update HTML</h1>
    <p id="notice">Old Notice: Exam tomorrow.</p>

   <div id="box"></div>

   <button onclick="updateNotice()">Update Notice</button>
   <hr>


   <h1 class="text4">4.Toggle CSS class with a single button</h1>
   <h2 class="sub">Subjects</h2>

    <ul id="subjects">
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <button onclick="addSubject()">Add Subject</button>
<hr>


     <h1 class="text5">5.Toggle CSS class with a single button </h1>
      <h1 id="head">Hello Students</h1>

    <button onclick="changeTheme()">Change Theme</button>



    <script>
        
        function enterusername(){
            let name =prompt("enter the name");
            document.getElementById("output").innerHTML= " welcome to " + name;
            output.style.color ="white";
            output.style.background ="green";
            page.style.background="yellow"

        }
        function changeText() {
            let h = document.getElementById("heading");
        

            h.textContent = "you don't just teach us coding. you inspire us to think creatively,solve problem,and turn our dreams into reality. ";
            h.style.color = "blue";
            h.style.backgroundColor = "yellow";
            page.style.backgroundColor = "aqua"
        } 
        
    function updateNotice() {
        document.getElementById("notice").remove();

        document.getElementById("box").innerHTML =
            "<h3>New Notice: Holiday Tomorrow</h3>";
    }

     function addSubject() {
            let li = document.createElement("li");

            li.textContent = "JavaScript";

            document.getElementById("subjects").appendChild(li);
     }

      function changeTheme() {
              document.getElementById("head").
                classList.toggle("highlight");
        }


        


    </script>
</body>
</html>
